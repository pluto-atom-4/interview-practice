[project]
name = "interview-practice"
version = "0.1.0"
description = "Algorithms and data structures practice. (Dependency management: uv preferred)"
dependencies = [
    "matplotlib>=3.8.0,<4.0.0",
    "seaborn>=0.13.0,<0.14.0",
    "tabulate>=0.9.0,<0.10.0",
    "numpy==2.4.2",
    "scikit-learn>=1.5.0,<2.0.0",
    "networkx>=3.1.0,<4.0.0",
    "fonttools>=4.49.0,<5.0.0",
    "skyfield>=1.46,<2.0.0",
    "cartopy==0.25.0",
    "schemdraw>=0.16,<1.0.0",
    "pillow==12.1.1",
    "opencv-python>=4.9.0,<5.0.0",
    "rembg==2.0.72",
    "yfinance==1.2.0",
    "librosa>=0.10.1,<1.0.0",
    "pdf2docx==0.5.9",
    "python-docx>=1.1.0,<2.0.0",
    "requests>=2.31.0,<3.0.0",
    "py3Dmol>=2.0.4,<3.0.0",
]
requires-python = ">=3.12,<3.13"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "black>=25.0.0,<26.0.0",
    "isort>=7.0.0,<8.0.0",
    "jupyter>=1.0.0,<2.0.0",
    "ipython>=8.22.0,<9.0.0",
    "pre-commit>=3.0.0,<4.0.0"
]
manim = [
    "manim>=0.18.0",
    "manimpango>=0.6.0,<0.6.1"
]

[tool.setuptools]
packages = [
    "algorithms",
    "data_structures",
    "drills",
    "leetcode",
    "ood",
    "system_design",
    "utils",
    "benchmarks",
    "docs",
    "notebooks"
]

# Use 'uv' (https://github.com/astral-sh/uv) for fast dependency management and installation.
# Example: 'uv pip install .[dev]'
# Pre-commit hooks are configured in .pre-commit-config.yaml

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
known_first_party = ["algorithms", "data_structures", "drills", "leetcode", "ood", "system_design", "utils", "benchmarks", "docs", "notebooks"]
known_third_party = ["pytest", "matplotlib", "seaborn", "tabulate"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"
